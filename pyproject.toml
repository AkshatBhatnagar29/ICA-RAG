[project]
name = "indian-contract-intelligence"
version = "0.1.0"
description = "Production-first Indian contract intelligence agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=5.2,<6",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "jinja2>=3.1,<4",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "pgvector>=0.3.6,<1",
  "fastembed>=0.4,<1",
  "pyarrow>=18,<23"
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-host-tmp"
