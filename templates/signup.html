<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create ICIA account</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fa;color:#17202a;font:14px/1.5 Inter,system-ui,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:32px;background:#fff;border:1px solid #e1e6eb;border-radius:12px;box-shadow:0 8px 28px #17202a0f}h1{margin:0 0 4px;text-align:center}.sub{text-align:center;color:#65717c;margin:0 0 22px}.brand{text-align:center;color:#173b57;font-size:20px;font-weight:800;margin-bottom:20px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd3da;border-radius:6px}.button{width:100%;padding:10px;border:0;border-radius:6px;background:#173b57;color:#fff;font-weight:700}.error{padding:10px;background:#fdecec;color:#b42318;border-radius:6px;margin-bottom:14px}a{color:#173b57}</style></head>
<body><main class="card"><div class="brand">ICIA</div><h1>Create account</h1><p class="sub">Development-only tenant bootstrap.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
{% if signup_enabled %}<form method="post" action="/api/v1/ui/signup"><div class="field"><label for="tenant_identifier">Tenant identifier</label><input id="tenant_identifier" name="tenant_identifier" required></div><div class="field"><label for="tenant_name">Tenant name</label><input id="tenant_name" name="tenant_name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="{{ password_min_length }}" required></div><div class="field"><label for="bootstrap_token">Development bootstrap token</label><input id="bootstrap_token" name="bootstrap_token" type="password" required></div><button class="button" type="submit">Create account</button></form>{% else %}<div class="error">Signup is disabled. Set <code>AUTH_BOOTSTRAP_TOKEN</code> in the local <code>.env</code> file and restart the API.</div>{% endif %}<p style="text-align:center;margin:18px 0 0"><a href="/api/v1/ui">Back to sign in</a></p></main></body></html>
